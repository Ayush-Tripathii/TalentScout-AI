use_default_settings: true
general:
  debug: false
  instance_name: "TalentScout SearXNG"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

server:
  port: 8080
  bind_address: "0.0.0.0"
  secret_key: "talentscout_searxng_secret_key_change_in_production"
  limiter: false
  image_proxy: false

ui:
  static_use_hash: true
  default_locale: "en"
  theme_args:
    simple_style: auto

engines:
  - name: google
    engine: google
    shortcut: go
    disabled: false
    use_mobile_ui: false

  - name: bing
    engine: bing
    shortcut: bi
    disabled: false

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: false

  - name: brave
    engine: brave
    shortcut: br
    disabled: false
