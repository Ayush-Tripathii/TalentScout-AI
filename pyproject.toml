[project]
name = "talentscout-ai"
version = "1.0.0"
description = "TalentScout AI - Recruitment Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.32.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "python-multipart>=0.0.9",
    "sqlmodel>=0.0.16",
    "alembic>=1.13.1",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "python-dotenv>=1.0.1",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "requests>=2.31.0",
    "pyjwt>=2.8.0",
    "duckduckgo_search>=5.0.0",
    "reportlab>=4.1.0",
    "watchdog>=4.0.0",
    "phonenumbers>=8.13.32",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "rapidfuzz>=3.7.0",
    "pandas>=2.2.1",
    "openpyxl>=3.1.2",
    "google-api-python-client>=2.122.0",
    "google-auth-httplib2>=0.2.0",
    "google-auth-oauthlib>=1.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
